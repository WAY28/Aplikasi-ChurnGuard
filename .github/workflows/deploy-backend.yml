name: Deploy backend to Render

# Render's own GitHub webhook is not connected for this service, so trigger
# its Deploy Hook from here instead. Only runs when backend code changes
# (or this workflow itself), and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL belum diset (repo Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # -f: fail on HTTP errors; the URL contains a secret key, so never echo it.
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy hook triggered for ${GITHUB_SHA}."
